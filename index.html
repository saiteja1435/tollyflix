<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendation Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
       <h1>🎬 TollyFlix</h1>
       <p>Discover Telugu Movies, Ratings, Trailers & More</p>
       <p><br></p>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search movies...">
            <button id="searchBtn">Search</button>
<button id="favoritesBtn">
❤️ Favorites
</button>
        </div>
        
      <select id="genreFilter">
    <option value="all">All Genres</option>
    <option value="28">Action</option>
    <option value="35">Comedy</option>
    <option value="18">Drama</option>
    <option value="10749">Romance</option>
    <option value="53">Thriller</option>
    <option value="27">Horror</option>
    <option value="12">Adventure</option>
    <option value="878">Sci-Fi</option>
</select>
<button id="trendingBtn">
🔥trending
</button>
    </header>

    <section>
        <h2>Movies</h2>
        <div id="loader" class="loader"></div>
        <div id="moviesContainer" class="movie-grid"></div>
    </section>

    <section>
        <h2>❤️ Favorites</h2>
        <div id="favoritesContainer" class="movie-grid"></div>
    </section>

    <script src="script.js"></script>
    <div id="movieModal" class="modal">
    <div class="modal-content">
        <span id="closeModal">&times;</span>
        <div id="modalBody"></div>
    </div>
</div>
</body>
</html>
